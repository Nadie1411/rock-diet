name: Deploy to VPS

# Push on `prod` -> build the SPA -> publish it to rockdiet.app.
# Only the frontend is deployed. The backend (pm2 "rockback"), /admin, /api,
# /backend and the cPanel-managed files in public_html are never touched.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 76.13.40.21
  DEPLOY_USER: rockdiet
  DEPLOY_PATH: /home/rockdiet/public_html
  SITE_URL: https://rockdiet.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          # VITE_API_URL comes from .env.production. Firebase values are
          # public client config, kept as repository variables.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}

      - name: Check build output
        run: test -s dist/index.html && ls dist/assets | head

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Back up current site files
        run: |
          ssh -i ~/.ssh/deploy_key ${DEPLOY_USER}@${DEPLOY_HOST} '
            set -e
            cd '"${DEPLOY_PATH}"'
            mkdir -p ~/deploy-backups
            tar czf ~/deploy-backups/site-$(date +%Y%m%d-%H%M%S).tgz \
              index.html assets favicon.svg firebase-messaging-sw.js icons.svg rock-diet-logo.png 2>/dev/null || true
            ls -1t ~/deploy-backups/site-*.tgz | tail -n +11 | xargs -r rm --
          '

      # Hashed assets first, index.html last, so visitors never get an
      # index.html that points at files that are not there yet.
      # No --delete: old hashed assets stay for clients with a cached index.
      - name: Upload assets
        run: |
          rsync -rlz --no-perms --chmod=D755,F644 --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/assets/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/assets/

      - name: Upload static files and index.html
        run: |
          rsync -rlzc --no-perms --chmod=D755,F644 --omit-dir-times \
            --exclude=/assets --exclude=/index.html \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/
          rsync -lz --no-perms --chmod=F644 \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/index.html ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/index.html

      - name: Verify site
        run: |
          sleep 5
          NEW=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          curl -fsS --retry 3 --retry-delay 5 "${SITE_URL}/" | grep -q "$NEW"
          curl -fsSI "${SITE_URL}/${NEW}" | head -1
          echo "Deployed ${NEW} to ${SITE_URL}"
